# --- Sombras ---
shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.4;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Qtile'", # Evita sombras extrañas en la barra de Qtile
  "_GTK_FRAME_EXTENTS@:c"
];

# --- Bordes Redondeados ---
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'", # Evita redondear la barra de Qtile
  "window_type = 'desktop'"
];

# --- Backend y Rendimiento ---
backend = "glx";
vsync = true;
glx-no-stencil = true;
glx-no-rebind-pixmap = true;